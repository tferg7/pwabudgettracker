# Publishes the public/ folder to GitHub Pages as a demo (no server; data stays in the browser)
name: Deploy demo to GitHub Pages

# Manual for now: GitHub Pages isn't enabled for this repo yet, and the demo is
# currently published from tferg7/tferg7.github.io. To use this workflow instead,
# set Settings -> Pages -> Source to "GitHub Actions", then run it from the Actions tab
# (and add back a push trigger if you want it to run on every push).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
